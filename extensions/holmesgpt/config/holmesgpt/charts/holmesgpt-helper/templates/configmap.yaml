apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "holmesgpt-helper.fullname" . }}-conf
data:
  default.conf: |+
    server {
        listen       80;
        listen  [::]:80;
        server_name  localhost;

        # 精确匹配
        location = /kapis/holmesgpt.dev/v1/api/v2/alerts {
            # 将请求映射为 backend 的 /api/v2/alerts
            proxy_pass http://alertmanager.{{ .Release.Namespace }}.svc:9093/api/v2/alerts;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 前缀匹配
        location ^~ /kapis/holmesgpt.dev/v1/api/v2/alerts/ {
            proxy_pass http://alertmanager.{{ .Release.Namespace }}.svc:9093/api/v2/alerts/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }


        location ^~ /kapis/holmesgpt.dev/v1/ {
            proxy_pass http://holmesgpt-agent-holmes.{{ .Release.Namespace }}.svc:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }

